# DonutCore config

start-money: 1000
teleport-warmup: 3          # másodperc (donutcore.bypass.warmup = 0)
homes-max: 3
team-max-members: 8
combat-seconds: 20
kill-shards: 1              # ennyi shard jár egy gyilkosságért
bounty-min: 1000
ah:
  tax: 0.05                 # 5% adó eladáskor
  hours: 48                 # hirdetés élettartama
  max-listings: 10
orders:
  max-orders: 5

rtp:
  min: 500
  max: 5000
  center-x: 0
  center-z: 0

afk:
  shards-per-minute: 1
  radius: 15
  # location: /donutcore setafk paranccsal állítható

# Ezek a parancsok le vannak tiltva harc közben
combat-blocked-commands: [spawn, rtp, tpa, tpahere, tpaccept, home, afk, sethome]

